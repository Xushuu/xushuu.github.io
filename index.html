<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Sistema de agendamento de sala de reunião e motorista. Organize reuniões e viagens de forma prática e visual.">
  <title>Agendamentos — Sala de Reunião & Motorista</title>
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="index.css">
</head>
<body>
  <!-- ===== HEADER ===== -->
  <header id="app-header" class="app-header">
    <div class="header-content">
      <div class="logo-area">
        <div class="logo-icon">
          <svg width="28" height="28" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round">
            <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
            <line x1="16" y1="2" x2="16" y2="6"/>
            <line x1="8" y1="2" x2="8" y2="6"/>
            <line x1="3" y1="10" x2="21" y2="10"/>
          </svg>
        </div>
        <div>
          <h1 id="app-title">Agendamentos</h1>
          <p class="header-subtitle">Sala de Reunião & Motorista</p>
        </div>
      </div>
      <div class="header-right">
        <div class="legend-area">
          <span class="legend-item legend-reuniao">
            <span class="legend-dot"></span>Reunião
          </span>
          <span class="legend-item legend-motorista">
            <span class="legend-dot"></span>Motorista
          </span>
        </div>
        <!-- Auth Area -->
        <div class="auth-area" id="auth-area">
          <button id="btn-google-login" class="btn-google" style="display:none;">
            <svg width="18" height="18" viewBox="0 0 48 48"><path fill="#EA4335" d="M24 9.5c3.54 0 6.71 1.22 9.21 3.6l6.85-6.85C35.9 2.38 30.47 0 24 0 14.62 0 6.51 5.38 2.56 13.22l7.98 6.19C12.43 13.72 17.74 9.5 24 9.5z"/><path fill="#4285F4" d="M46.98 24.55c0-1.57-.15-3.09-.38-4.55H24v9.02h12.94c-.58 2.96-2.26 5.48-4.78 7.18l7.73 6c4.51-4.18 7.09-10.36 7.09-17.65z"/><path fill="#FBBC05" d="M10.53 28.59c-.48-1.45-.76-2.99-.76-4.59s.27-3.14.76-4.59l-7.98-6.19C.92 16.46 0 20.12 0 24c0 3.88.92 7.54 2.56 10.78l7.97-6.19z"/><path fill="#34A853" d="M24 48c6.48 0 11.93-2.13 15.89-5.81l-7.73-6c-2.15 1.45-4.92 2.3-8.16 2.3-6.26 0-11.57-4.22-13.47-9.91l-7.98 6.19C6.51 42.62 14.62 48 24 48z"/></svg>
            Entrar com Google
          </button>
          <div id="user-info" class="user-info" style="display:none;">
            <img id="user-avatar" class="user-avatar" src="" alt="Avatar" referrerpolicy="no-referrer">
            <span id="user-name" class="user-name"></span>
            <button id="btn-logout" class="btn-logout" title="Sair">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"/><polyline points="16 17 21 12 16 7"/><line x1="21" y1="12" x2="9" y2="12"/></svg>
            </button>
          </div>
        </div>
      </div>
    </div>
  </header>

  <!-- ===== MAIN LAYOUT ===== -->
  <main id="main-content" class="main-content">
    <!-- Calendar Section -->
    <section id="calendar-section" class="calendar-section" aria-label="Calendário">
      <div class="calendar-card glass-card">
        <!-- Calendar Navigation -->
        <div class="calendar-nav">
          <button id="btn-prev-month" class="nav-btn" aria-label="Mês anterior">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="15 18 9 12 15 6"/></svg>
          </button>
          <h2 id="calendar-month-label" class="month-label"></h2>
          <button id="btn-next-month" class="nav-btn" aria-label="Próximo mês">
            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="9 18 15 12 9 6"/></svg>
          </button>
        </div>
        <!-- Weekday headers -->
        <div class="calendar-weekdays" id="calendar-weekdays">
          <span>Dom</span><span>Seg</span><span>Ter</span><span>Qua</span><span>Qui</span><span>Sex</span><span>Sáb</span>
        </div>
        <!-- Calendar Grid -->
        <div class="calendar-grid" id="calendar-grid"></div>
      </div>
    </section>

    <!-- Right Panel — Time Slots & Day Agenda -->
    <section id="agenda-section" class="agenda-section" aria-label="Agenda do dia">
      <div class="agenda-card glass-card">
        <div class="agenda-header">
          <h2 id="agenda-date-label" class="agenda-date-label">Selecione um dia</h2>
          <button id="btn-new-booking" class="btn-primary" style="display:none;">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="12" y1="5" x2="12" y2="19"/><line x1="5" y1="12" x2="19" y2="12"/></svg>
            Novo Agendamento
          </button>
        </div>
        <!-- Time Slots -->
        <div class="timeslots-container" id="timeslots-container">
          <div class="empty-state" id="empty-state">
            <svg width="64" height="64" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1" stroke-linecap="round" stroke-linejoin="round" opacity="0.3">
              <rect x="3" y="4" width="18" height="18" rx="2" ry="2"/>
              <line x1="16" y1="2" x2="16" y2="6"/>
              <line x1="8" y1="2" x2="8" y2="6"/>
              <line x1="3" y1="10" x2="21" y2="10"/>
              <line x1="10" y1="14" x2="14" y2="14"/>
            </svg>
            <p>Clique em um dia no calendário para ver os horários disponíveis</p>
          </div>
        </div>
      </div>
    </section>
  </main>

  <!-- ===== MODAL — Booking Form ===== -->
  <div id="modal-overlay" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="modal-title" style="display:none;">
    <div class="modal-card glass-card">
      <div class="modal-header">
        <h3 id="modal-title">Novo Agendamento</h3>
        <button id="btn-close-modal" class="modal-close-btn" aria-label="Fechar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <form id="booking-form" class="booking-form" novalidate>
        <input type="hidden" id="form-date" name="date">
        <input type="hidden" id="form-time" name="time">

        <div class="form-row">
          <div class="form-group">
            <label for="form-datetime-display">Data & Horário</label>
            <input type="text" id="form-datetime-display" readonly class="input-readonly">
          </div>
        </div>

        <!-- Activity Type Toggle -->
        <div class="form-group">
          <label>Tipo de Atividade</label>
          <div class="toggle-group" id="toggle-activity">
            <button type="button" class="toggle-btn active" data-value="reuniao" id="toggle-reuniao">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2"/><circle cx="9" cy="7" r="4"/><path d="M23 21v-2a4 4 0 0 0-3-3.87"/><path d="M16 3.13a4 4 0 0 1 0 7.75"/></svg>
              Reunião
            </button>
            <button type="button" class="toggle-btn" data-value="motorista" id="toggle-motorista">
              <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><rect x="1" y="3" width="15" height="13"/><polygon points="16 8 20 8 23 11 23 16 16 16 16 8"/><circle cx="5.5" cy="18.5" r="2.5"/><circle cx="18.5" cy="18.5" r="2.5"/></svg>
              Motorista
            </button>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group">
            <label for="form-name">Nome Completo <span class="required">*</span></label>
            <input type="text" id="form-name" name="name" required placeholder="Seu nome completo" autocomplete="name">
          </div>
          <div class="form-group">
            <label for="form-email">E-mail <span class="required">*</span></label>
            <input type="email" id="form-email" name="email" required placeholder="seu@email.com" autocomplete="email" readonly>
          </div>
        </div>

        <div class="form-row">
          <div class="form-group form-group-small">
            <label for="form-people">Nº de Pessoas</label>
            <input type="number" id="form-people" name="people" min="1" max="50" value="1">
          </div>
        </div>

        <div class="form-group">
          <label for="form-notes">Observações</label>
          <textarea id="form-notes" name="notes" rows="3" placeholder="Detalhes adicionais sobre o agendamento..."></textarea>
        </div>

        <div class="form-actions">
          <button type="button" id="btn-cancel-booking" class="btn-secondary">Cancelar</button>
          <button type="submit" id="btn-save-booking" class="btn-primary btn-save">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><polyline points="20 6 9 17 4 12"/></svg>
            Salvar Agendamento
          </button>
        </div>
      </form>
    </div>
  </div>

  <!-- ===== MODAL — Booking Details (View / Edit) ===== -->
  <div id="detail-overlay" class="modal-overlay" role="dialog" aria-modal="true" aria-labelledby="detail-title" style="display:none;">
    <div class="modal-card glass-card detail-modal">
      <div class="modal-header">
        <h3 id="detail-title">Detalhes do Agendamento</h3>
        <button id="btn-close-detail" class="modal-close-btn" aria-label="Fechar">
          <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><line x1="18" y1="6" x2="6" y2="18"/><line x1="6" y1="6" x2="18" y2="18"/></svg>
        </button>
      </div>
      <div class="detail-body" id="detail-body"></div>
      <div class="form-actions">
        <button type="button" id="btn-edit-booking" class="btn-primary" style="display:none;">
          <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.5" stroke-linecap="round" stroke-linejoin="round"><path d="M11 4H4a2 2 0 0 0-2 2v14a2 2 0 0 0 2 2h14a2 2 0 0 0 2-2v-7"/><path d="M18.5 2.5a2.121 2.121 0 0 1 3 3L12 15l-4 1 1-4 9.5-9.5z"/></svg>
          Editar
        </button>
        <button type="button" id="btn-close-detail-bottom" class="btn-secondary">Fechar</button>
      </div>
    </div>
  </div>

  <!-- ===== TOAST NOTIFICATION ===== -->
  <div id="toast" class="toast" aria-live="polite"></div>

  <script type="module" src="app.js"></script>
</body>
</html>
